# markdownlint config tuned to be compatible with the existing docs (near-zero churn):
# the broadly-violated stylistic rules are disabled so current Markdown passes as-is,
# while the ~40 remaining rules still guard new content. Skipped paths: .markdownlintignore.
default: true
MD013: false   # line-length: docs use long lines, wide tables, and full URLs
MD022: false   # blanks-around-headings
MD031: false   # blanks-around-fences
MD032: false   # blanks-around-lists
MD058: false   # blanks-around-tables
MD012: false   # no-multiple-blanks
MD047: false   # single-trailing-newline (left to end-of-file-fixer where applicable)
MD007: false   # ul-indent
MD033: false   # no-inline-html: docs embed small HTML snippets (<br>, <details>, ...)
MD034: false   # no-bare-urls
MD040: false   # fenced-code-language
MD041: false   # first-line-heading
MD024: false   # no-duplicate-heading
MD014: false   # commands-show-output
