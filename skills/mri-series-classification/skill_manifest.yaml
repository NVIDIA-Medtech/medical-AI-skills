id: medagent.mri_series_classification
version: "0.1.0"
upstream_refs:
  - kind: github_repo
    name: Forithmus/MR-RATE
    repo_url: https://github.com/Forithmus/MR-RATE
    revision: main
    notes: wraps mr_rate_preprocessing MRI series
license: Apache-2.0
intended_use:
  summary: >
    assigns each MRI series a modality label (T1w, T2w, FLAIR, SWI, MRA, ...) using a rule hierarchy (MR-RATE MRI step 3).
  scope: development
  not_for:
    - clinical deployment
    - regulatory de-identification
    - autonomous diagnosis
    - patient-facing use
inputs:
  - name: fixtures_dir
    type: directory
  - name: mr_rate_root
    type: directory
outputs:
  - name: result_json
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/run_series_classification.py
  side_effects:
    requires_gpu: none
    pip_packages:
      - pandas
      - numpy
limitations:
  - Upstream accession_to_uid anonymization is currently an identity pass-through, so study-ID de-identification is a no-op unless inputs are pre-anonymized.
  - Ships with small synthetic PHI-free fixtures; not clinically representative.
phi_scope_disclaimer: >
  Not a regulatory de-identifier; review output before sharing. Not for clinical use.
validation:
  expected_runtime_seconds:
    max: 300
    inference_path: telemetry.wall_seconds
  sanity_checks:
    - {path: skill, eq: mri-series-classification}
    - {path: status, eq: ok}
    - {path: preflight.aligned, eq: true}
    - {path: telemetry.wall_seconds, gte: 0}
  reproducibility:
    mode: repeat
    fixture: fixtures
