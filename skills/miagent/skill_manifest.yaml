id: medagent.miagent
version: 0.1.0
license: Apache-2.0
upstream_refs:
  - kind: source_provenance
    name: MIAgent v3.5
    repo_url: https://github.com/heyufan1995/MIAgent
    git_commit: 652d01431f652ea88bcd1d56a4b7a0d07bd6aff5
    notes: >
      Provenance of the preserved workflow, templates, and tools. These are
      bundled sources; this is not a claim that initialization wraps an
      external model or satisfies the catalog's upstream-tool admission rule.
intended_use:
  summary: >
    Host-agent medical-imaging research using the MIAgent v3.5 workflow.
    This machine entrypoint initializes the research record only; the agent
    follows SKILL.md to perform discovery, implementation, and experiments.
  scope: development
  not_for:
    - clinical decision support
    - autonomous diagnosis
    - claiming research completion from initialization
inputs:
  - name: task_request
    type: file_path
    formats: [json]
outputs:
  - name: initialization_report
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/init_challenge.py
  args: ["${python}", "${script}", "${fixture}", "--output-dir", "${out}/workspace"]
  dependencies: {}
  test_dependencies:
    pytest: ">=8,<10"
  side_effects:
    pip_packages: []
    local_writes: ["${out}/workspace"]
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    env_required: []
validation:
  sanity_checks:
    - {path: status, eq: initialized}
    - {path: artifacts, length_eq: 3}
    - {path: research_completed, eq: false}
    - {path: experiments_launched, eq: 0}
  expected_runtime_seconds:
    max: 10
  reproducibility:
    mode: repeat
    fixture: fixtures/request.json
    runs: 2
limitations:
  - The runtime contract covers initialization only, not the agent-led workflow.
  - Research behavior is evaluated separately using evals/evals.json and focused tests.
  - Optional helper scripts have separate prerequisites and side effects documented in SKILL.md.
  - The medical-AI-skills upstream-wrapper admission policy needs a workflow contribution decision.
  - No NVIDIA verification, signing, or catalog publication is claimed.
