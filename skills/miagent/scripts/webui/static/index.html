<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MIAgent Files</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div id="app">
      <header class="appbar">
        <div class="identity">
          <strong id="challenge-title">MIAgent</strong>
          <span id="challenge-root">Loading challenge...</span>
        </div>
        <div class="toolbar">
          <label class="search">
            <span class="visually-hidden">Filter files</span>
            <input id="file-filter" type="search" placeholder="Filter files" autocomplete="off">
          </label>
          <button id="collapse-button" class="icon-button" type="button" title="Collapse folders" aria-label="Collapse folders">−</button>
          <button id="refresh-button" class="icon-button" type="button" title="Refresh files" aria-label="Refresh files">↻</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="explorer" aria-label="Challenge files">
          <div class="explorer-heading">
            <span>Files</span>
            <span id="file-count" class="count"></span>
          </div>
          <div id="file-tree" class="file-tree"></div>
        </aside>

        <section class="preview" aria-label="File preview">
          <header class="previewbar">
            <nav id="breadcrumbs" class="breadcrumbs" aria-label="Selected file"></nav>
            <a id="open-file" class="icon-button link-button" href="#" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open in a new tab" hidden>↗</a>
          </header>
          <div id="preview-body" class="preview-body">
            <div class="empty-state">
              <strong>Select a file</strong>
              <span>Markdown, logs, code, images, and result viewers open here.</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
