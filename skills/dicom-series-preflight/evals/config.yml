schema_version: 1
harbor:
  pre_agent_setup:
    - >-
      python -m venv --system-site-packages /tmp/dicom-preflight-python &&
      /tmp/dicom-preflight-python/bin/python -m pip install --disable-pip-version-check
      'pydicom>=3.0.2,<4' 'nibabel>=5.4,<6' 'numpy>=1.25,<3' 'typer>=0.9' &&
      /tmp/dicom-preflight-python/bin/python /workspace/input/prepare_series.py /tmp/dicom-preflight-input
