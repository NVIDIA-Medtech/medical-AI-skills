# HoloHub Flow Benchmark — application contract template.
#
# Copy this file to contracts/<app>.yaml and fill in the app-specific
# values. The skill consumes one such file per app in verify mode and
# turns each declared field into an assertion in the evidence pack.
#
# All paths are relative to HOLOHUB_ROOT (the HoloHub checkout).
# Set a field to null (or omit it) to skip that assertion.

contract_version: 1

# Application name as it appears under applications/<app>/.
app: REPLACE_ME

# Hardware lines this contract is intended to cover. Per medtech-platform
# brief §15.10. Six lines are relevant; pick any subset that applies.
# `sku: null` means "the whole line"; pin to a specific SKU for tighter
# claims. The skill records this list verbatim in the evidence pack —
# it does not detect or assert the runtime host's actual SKU.
target_hardware: []
  # Example entries:
  # - {line: data_center,   sku: H100}        # cloud / hospital datacenter
  # - {line: data_center,   sku: B200}
  # - {line: edge_clinical, sku: IGX_AGX_Orin}  # bedside / OR-side
  # - {line: edge_clinical, sku: Thor}
  # - {line: workstation,   sku: RTX_6000_Ada}  # dev / lab
  # - {line: jetson,        sku: AGX_Orin}

# The single GPU SKU on which this contract's latency budgets were
# calibrated. When evidence pack reports a different runtime GPU, the
# numeric budgets are valid only for `calibration_hardware`; this field
# is the wrap-preferred answer to cross-host reproducibility (per
# §15.11 + §15.10 brief).
calibration_hardware: null  # e.g. RTX_6000_Ada / H100 / IGX_AGX_Orin

# Files the app reads at runtime. Discovered by running once in measure
# mode and inspecting which files the run touches. Pinning sha256 is
# optional; null = "must exist and be non-empty".
required_data_files: []
  # Example entries:
  # - {path: data/<app>/model.onnx,       sha256: null}
  # - {path: data/<app>/sample.mp4,       sha256: null}
  # - {path: data/<app>/labels.txt,       sha256: null}

# Path to the app entry point under applications/. The skill asserts
# this file exists.
source_file: applications/REPLACE_ME/python/REPLACE_ME.py

# Optional: the single model file whose sha256 is recorded in the
# evidence pack's `invocation.model_sha256` field. Set to null to skip.
model_file: null

# Operator-sequence assertions on parsed data-flow paths.
flow_assertions:

  # `primary_sequence` lists the operators that must appear, in this
  # order, as a contiguous subsequence in at least one observed flow
  # path per requested scheduler. Operator names match what
  # benchmark.py emits in the logger files — discover them by running
  # in measure mode first.
  primary_sequence: []
    # Example:
    # - "<App>.source"
    # - "<App>.preprocessor"
    # - "<App>.inferer"
    # - "<App>.postprocessor"
    # - "<App>.visualizer"

  # `direct_paths` is a list of exact path tuples that must each appear
  # verbatim (not as a subsequence) in the observed flows.
  direct_paths: []
    # Example:
    # - ["<App>.source", "<App>.visualizer"]

# Latency budgets. Each field is asserted against the primary path
# metrics of every requested scheduler. Set to null to skip.
latency_budgets:
  p50_ms_max:            null  # median budget
  p95_ms_max:            null  # 95th percentile — typical real-time gate
  p99_ms_max:            null  # tail
  tail_95_100_ms_max:    null  # spread between p95 and p100
  flatness_10_90_ms_max: null  # spread between p10 and p90 — jitter proxy
  min_sample_count:      null  # min samples per path after trim

# Optional notes shown in the evidence pack for human readers.
notes: ""
