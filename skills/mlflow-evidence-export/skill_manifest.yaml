id: medagent.mlflow_evidence_export
version: 0.1.0
upstream_refs:
  - kind: pypi_package
    name: mlflow
    version_constraint: ">=2.10,<4"
license: Apache-2.0
intended_use:
  summary: Export a privacy-limited Medical AI Skills evidence summary to an MLflow experiment.
  scope: development
  not_for:
    - raw medical-data upload
    - model registration
    - clinical interpretation
    - regulatory submission
inputs:
  - name: evidence_source
    type: path
    description: Evidence pack directory, trusted-run root containing skill_run/, or direct result JSON.
  - name: mode
    type: string
    description: dry-run, local, or databricks.
    optional: true
    default: dry-run
outputs:
  - name: export_result
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/export_evidence_pack.py
  args:
    - "${python}"
    - "${script}"
    - "${fixture}"
    - "--mode"
    - "dry-run"
  dependencies:
    mlflow: ">=2.10,<4"
  test_dependencies:
    pytest: ">=7"
  env_optional:
    - DATABRICKS_HOST
    - DATABRICKS_TOKEN
    - MLFLOW_TRACKING_URI
  side_effects:
    pip_packages:
      - "mlflow>=2.10,<4"
    local_writes:
      - {path: "<current-working-directory>/mlruns", approx_mb_max: 100, optional: true}
    home_writes: []
    network_endpoints:
      - "https://<caller-provided-databricks-workspace>"
    requires_docker: false
    requires_gpu: none
    environment:
      clean_environment_required: false
      clean_environment_recommended: false
      modifies_active_python_environment: false
      user_environment_modification_ok: false
      recommended_isolation: caller-selected Python environment
limitations:
  - "Discussion prototype: logs tags, runtime metrics, and one sanitized JSON summary only."
  - Raw evidence-pack files, checkpoints, NIfTI, DICOM, and other medical artifacts are not uploaded.
  - Databricks authentication and experiment permissions are delegated to the MLflow client environment.
  - The committed dry-run fixture does not validate a live MLflow or Databricks service.
validation:
  expected_runtime_seconds:
    min: 0.0
    max: 10.0
  sanity_checks:
    - {path: skill, eq: mlflow_evidence_export}
    - {path: status, eq: dry_run}
    - {path: mode, eq: dry-run}
    - {path: source.pack_kind, eq: skill_run}
    - {path: source.skill_id, eq: medagent.fixture}
    - {path: mlflow.available, exists: true}
  expected_cost:
    wall_seconds: {max: 10}
    cpu_seconds: {max: 10}
    rss_mb_peak: {max: 300}
    gpu_seconds: {max: 0}
    gpu_memory_mb_peak: {max: 0}
  reproducibility:
    mode: repeat
    fixture: fixtures/sample_pack
    runs: 2
    reason: Dry-run summary extraction is deterministic for a fixed evidence pack.
