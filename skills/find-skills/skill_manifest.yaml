id: medagent.find_skills
version: 0.2.0
upstream_refs:
  - kind: pypi_package
    name: PyYAML
    version_constraint: ">=6.0"
license: Apache-2.0
intended_use:
  summary: >
    Local recommender for Medical AI Skills skills and verifiers.
    The entrypoint reads committed skill_manifest.yaml files, ranks
    candidates for a short engineering task, and emits a JSON shortlist
    with fit rationale and caveats. Agents should still read the chosen
    candidate's SKILL.md and manifest before adapting an invocation.
  scope: development
  not_for:
    - clinical interpretation
    - regulatory submission
    - ranking model performance
    - autonomous deployment decisions

inputs:
  - name: task_request
    type: prompt_text
    formats: [natural_language]
    description: >
      A user-described engineering task ("segment a CT NIfTI volume",
      "audit a skill manifest", "is there a skill for X"). The LLM
      reads Medical AI Skills' local manifests via the list helper, then
      reasons about which skill (if any) fits.

outputs:
  - name: recommendation
    type: json
    schema: validators/output_schema.json
    description: >
      JSON shortlist containing the recommended skill or verifier ids,
      ranking scores, fit rationale, caveats, and a no-fit flag.

runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/find_skills.py
  dependencies:
    pyyaml: ">=6.0"
  test_dependencies:
    jsonschema: ">=4.0"
  side_effects:
    pip_packages: [pyyaml>=6.0]
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    env_required: []

cost:
  # Per-invocation agent-overhead token cost measured by NeMo Agent Toolkit
  # (NAT) profiler — the cost an LLM-driven agent pays to call this skill
  # once. The skill itself emits zero tokens. See tools/nat_audit/README.md
  # for methodology (pinned model, agent type, tool registry size).
  token_estimate:
    common:
      model: meta/llama-3.3-70b-instruct
      agent_type: tool_calling_agent
      measured_at: 2026-05-16
      methodology: tools/nat_audit/README.md
    isolated_tool_call:                  # floor: agent already knows the skill
      prompt_tokens: 2259
      completion_tokens: 58
      total_tokens: 2317
      llm_calls: 2
      n_tools_in_workflow: 9
    end_to_end_workflow:                 # realistic: agent reads SKILL.md, then invokes
      prompt_tokens: 5553
      completion_tokens: 80
      total_tokens: 5633
      llm_calls: 3
      n_tools_in_workflow: 11
      scenario: realistic_user_workflow

paired_verifiers:
  - id: medagent.verifiers.find_skills_quality_v1
    status: implemented
    consumes: evidence_pack_dir
    purpose: >
      Second-pass selector evidence audit. Confirms the source pack passed,
      recommendations are score-sorted, referenced manifests resolve to the
      reported ids and kinds, no-fit semantics are consistent, and selector
      scope remains disclosed.

limitations:
  - >
    Recommendations come from a lightweight lexical ranker over locally
    committed manifests. It is a selection aid, not a performance
    benchmark or proof that the skill fits every user constraint.
  - >
    Local-only: does not query external skill marketplaces, install
    counts, or live repository metadata. Adding a new candidate
    requires committing its skill_manifest.yaml under skills/ or
    verifiers/.
  - >
    The score is only a deterministic shortlist heuristic. Agents and
    reviewers must still inspect the candidate's SKILL.md,
    skill_manifest.yaml, side effects, and limitations before running it
    or recommending it for a specific artifact.
  - >
    Verifiers consume evidence packs produced by their paired skill;
    this recommender will surface a verifier when the user asks about
    quality assessment, but the verifier itself does not replace the
    primary skill.

validation:
  expected_runtime_seconds:
    min: 0.01
    max: 5.0
  sanity_checks:
    - {path: skill, eq: find_skills}
    - {path: input.query, matches: ".+"}
    - {path: catalog.count, gte: 1}
    - {path: recommendations, length_gte: 1}
    - {path: top_recommendation.id, eq: medagent.nv_segment_ct}
    - {path: top_recommendation.score, gt: 0}
    - {path: no_fit, eq: false}
  expected_cost:
    wall_seconds: {max: 5}
    cpu_seconds: {max: 5}
    rss_mb_peak: {max: 300}
  reproducibility:
    mode: repeat
    fixture: fixtures/example_task.txt
    runs: 2
