id: holohub_imaging_ai_segmentator
version: 0.1.0
upstream_refs:
  - kind: github_repo
    name: nvidia-holoscan/holohub
    repo_url: https://github.com/nvidia-holoscan/holohub
    git_commit: 90e0af6b2fa938d2bfa93237d177c76e4763158a
    notes: applications/imaging_ai_segmentator
license: Apache-2.0
intended_use:
  summary: >
    Run the canonical NVIDIA HoloHub imaging_ai_segmentator app on a DICOM
    CT series via its native `./holohub run` CLI; report file inventory,
    sizes, hashes, runtime, holohub commit and container image so the
    eval_engine can verify the run and detect drift between runs.
  scope: development
  not_for:
    - clinical deployment
    - clinical interpretation
    - autonomous diagnosis
    - regulatory submission

inputs:
  - name: dicom_dir
    type: directory_path
    formats: [dicom]
    description: >
      Directory passed via $HOLOSCAN_INPUT_PATH. The HoloHub app expects
      a CT series here.
    # If a fresh checkout points the eval_engine at the committed fixtures/
    # directory, only fixtures/build_dicom_from_nifti.py is present and
    # the input boundary check fails with "no readable DICOM files".
    # The preflight surfaces this hint so the next message after the
    # error is "here's how to bake the fixture", not just a 404.
    fixture_help: >
      The committed fixtures/ directory contains only
      build_dicom_from_nifti.py because patient-shaped DICOM series are
      gitignored. Rebake a runnable fixture from a Decathlon Task09
      Spleen NIfTI volume with:
        python3 skills/holohub-imaging-ai-segmentator/fixtures/build_dicom_from_nifti.py \
          .workbench_data/datasets/Task09_Spleen/imagesTr/spleen_10.nii.gz \
          .workbench_data/holohub_input/spleen_10
      Then point --fixture at .workbench_data/holohub_input/spleen_10.

outputs:
  - name: dicom_seg
    type: file_path
    formats: [dicom_seg]
  - name: nifti_segmentation
    type: file_path
    formats: [nifti]
  - name: result_json
    type: json
    schema: validators/output_schema.json

paired_verifiers:
  - id: medagent.verifiers.holohub_imaging_segmentation_quality_v1
    status: implemented
    consumes: evidence_pack_dir
    purpose: >
      Confirms DICOM SEG and NIfTI inventory, non-zero seg_pixel_max_value, and
      optional on-disk NIfTI foreground fraction. Catches empty TotalSegmentator
      masks when input anatomy does not match the model.

runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/run_holohub_app.py
  # Eval engine invokes: `python <script> <fixture>`. All other configuration
  # comes from environment variables so the uniform eval_engine invocation
  # pattern still works. The eval_engine captures these into replay.sh.
  # HOLOHUB_ROOT is required; the others are optional overrides/defaults.
  env_required:
    - HOLOHUB_ROOT             # required, path to a clone of HoloHub
  env_optional:
    - HOLOHUB_RUN_MODE         # "container" (default) or "local"
    - HOLOSCAN_OUTPUT_PATH     # optional override for app output dir
    - HOLOSCAN_MODEL_PATH      # optional override for model dir
    - HOLOHUB_TIMEOUT_SECONDS  # optional, default 1800
  external_assets:
    - kind: github_app
      repo: nvidia-holoscan/holohub
      path: applications/imaging_ai_segmentator
      install_command: |
        git clone https://github.com/nvidia-holoscan/holohub.git $HOLOHUB_ROOT
        cd $HOLOHUB_ROOT
        ./holohub run imaging_ai_segmentator
    - kind: docker_image
      reference: nvcr.io/nvidia/clara-holoscan/holoscan:v4.1.0-cuda13
      pulled_by: ./holohub run imaging_ai_segmentator (first invocation)
    - kind: monai_model
      name: wholeBody_ct_segmentation (TotalSegmentator)
      source: https://github.com/Project-MONAI/model-zoo/tree/dev/models/wholeBody_ct_segmentation
      downloaded_by: ./holohub setup or ./holohub run (cmake HOLOHUB_DOWNLOAD_DATASETS)
    - kind: public_dataset_fixture_source
      name: Medical Segmentation Decathlon Task09 Spleen
      source: http://medicaldecathlon.com/
      usage: >
        Optional local fixture source for fixtures/build_dicom_from_nifti.py;
        the repo does not commit the NIfTI volumes or generated DICOM series.
  side_effects:
    pip_packages: []                 # All Python deps live inside the container
    fixture_builder_pip_packages: [nibabel>=4.0, numpy>=1.23, pydicom>=2.4]
    local_writes:
      - {path: $HOLOHUB_ROOT, approx_mb_max: 5000}     # holohub clone + build artefacts
      - {path: /tmp/holohub-*.cid, approx_mb_max: 1}    # docker container id files
    home_writes:
      - {path: /var/lib/docker/, approx_mb_max: 20000}  # 16-20 GB image + content
    network_endpoints:
      - https://github.com
      - https://nvcr.io
    requires_docker: true
    requires_gpu: cuda
    env_required:
      - HOLOHUB_ROOT
    env_optional:
      - HOLOHUB_RUN_MODE
      - HOLOSCAN_OUTPUT_PATH
      - HOLOSCAN_MODEL_PATH
      - HOLOHUB_TIMEOUT_SECONDS

cost:
  # Per-invocation agent-overhead token cost measured by NeMo Agent Toolkit
  # (NAT) profiler — the cost an LLM-driven agent pays to call this skill
  # once. The skill itself emits zero tokens. See tools/nat_audit/README.md
  # for methodology (pinned model, agent type, tool registry size).
  token_estimate:
    common:
      model: meta/llama-3.3-70b-instruct
      agent_type: tool_calling_agent
      measured_at: 2026-05-16
      methodology: tools/nat_audit/README.md
    isolated_tool_call:
      prompt_tokens: 2328
      completion_tokens: 47
      total_tokens: 2375
      llm_calls: 2
      n_tools_in_workflow: 9
    end_to_end_workflow:
      prompt_tokens: 5050
      completion_tokens: 89
      total_tokens: 5139
      llm_calls: 3
      n_tools_in_workflow: 11
      scenario: realistic_user_workflow

limitations:
  - >
    HoloHub's auto-downloaded "test" DICOM fixture is a single-slice CT
    (CT_DICOM_SINGLE/7106) and triggers an empty segmentation: graph
    executes but the output mask is all zeros. Real verification needs a
    multi-slice CT abdomen series. The repo ships
    `fixtures/build_dicom_from_nifti.py` which converts a Decathlon
    Spleen NIfTI volume into a HoloHub-acceptable DICOM CT series.
  - >
    Synthesised DICOM fixtures must include `ImageType=['ORIGINAL',
    'PRIMARY']` (HoloHub's SeriesSelectorOperator filter) and `StudyID`
    (required by highdicom's DICOM SEG writer). Missing either silently
    falls back to the auto-fetched single-slice brain CT or fails late
    inside the SEG writer.
  - Container mode requires docker, an NVIDIA GPU, and ~18GB GPU memory
    for a 55-slice CT abdomen series during sliding-window inference.
  - First container build downloads the Holoscan SDK image (~minutes).
    Subsequent runs reuse the cached image. The wrapper passes
    `--configure-args=-DHOLOHUB_DOWNLOAD_DATASETS=OFF` to skip
    re-fetching the upstream test DICOM zip on every run.

validation:
  # Subprocess-level envelope is set wide because container mode includes
  # docker pull + image build the first time. The skill also reports
  # `runtime.app_seconds` (time spent inside `./holohub run` after the
  # container is ready), which is what the eval_engine should pin against
  # once the image is cached.
  expected_runtime_seconds:
    min: 5.0
    max: 1800.0
    inference_path: runtime.app_seconds

  sanity_checks:
    # The app must have exited cleanly.
    - {path: invocation.exit_code, eq: 0}

    # At least one DICOM SEG file at the output dir root.
    - {path: output.dicom_seg.count, gte: 1}

    # The DICOM SEG file is non-trivial. A real 104-class segmentation
    # over a 200-slice abdomen CT series is multi-MB; we set the floor
    # low enough to allow smaller fixtures but high enough to catch
    # empty stub files.
    - {path: output.dicom_seg.total_bytes, gt: 50000}

    # saved_images_folder must contain both the original NIfTI and the
    # segmentation NIfTI for at least one series.
    - {path: output.nifti.original.count, gte: 1}
    - {path: output.nifti.segmentation.count, gte: 1}

    # Both NIfTIs must be non-trivial in size.
    - {path: output.nifti.original.total_bytes, gt: 100000}
    - {path: output.nifti.segmentation.total_bytes, gt: 100000}

    # The segmentation must contain at least one non-background voxel.
    # This is the canonical silent-failure detector for this app: the
    # MONAI inference operator prints "Output Seg image pixel max value:
    # <N>"; if N == 0 every voxel was assigned to the background class.
    # That happens when input anatomy does not match the model (e.g.
    # feeding a brain CT to a whole-body abdomen TotalSegmentator) or
    # when input volume is too small / cropped.
    - {path: output.seg_signals.seg_pixel_max_value, gt: 0}
    - {path: output.seg_signals.empty_segmentation_warning, eq: false}

    # holohub root must be a real clone with a resolvable commit.
    - {path: invocation.holohub_commit, ne: ""}

  # Cost envelope. Domain-neutral verifier: a skill that claims to do
  # this much work must consume this much measurable cost. Out-of-envelope
  # is a strong silent-failure signal independent of what the skill author
  # remembered to declare in `sanity_checks`. Wall and CPU come from
  # rusage/getrusage. GPU comes from host `nvidia-smi` polling, but Docker
  # container processes are not reliable descendants of the eval-engine
  # runner, so positive GPU lower bounds are not a stable gate here. CUDA
  # availability is enforced by environment preflight; output sanity checks
  # verify the app actually emitted DICOM SEG/NIfTI artifacts.
  expected_cost:
    wall_seconds:        {min: 5,    max: 1800}     # cold-build to warm-replay span
    cpu_seconds:         {max: 600}                  # cmake + ninja + python
    gpu_seconds:         {max: 60}                   # container attribution is best-effort; no positive lower bound
    gpu_memory_mb_peak:  {max: 25000}                # container attribution is best-effort; no positive lower bound
    rss_mb_peak:         {max: 8000}                 # subprocess host-side; container memory is opaque
    # llm_tokens_* not declared: this is a non-LLM skill. The skill does
    # not self-report runtime.llm_tokens_* and the eval_engine's None-vs-max
    # comparison falsely fires when both sides are absent. Leaving these
    # out is the correct shape.
  reproducibility:
    mode: preflight
    fixture: fixtures/build_dicom_from_nifti.py
    runs: 2
    reason: >
      End-to-end repeatability requires a HoloHub checkout plus a generated
      DICOM series and container/local app dependencies. The repository audit
      repeats the declared input/env boundary check; curated packs carry
      artifact hashes for full HoloHub runs.
