id: medagent.report_anonymization
version: 0.1.0
upstream_refs:
  - kind: source_tree
    name: mr_rate_preprocessing.reports_preprocessing.01_anonymization
    revision: monorepo-local
    notes: >
      Upstream vLLM anonymizer (anonymize_reports_parallel.py) wrapped in live
      mode; path resolved via --mr-rate-root or $MR_RATE_REPORTS_ROOT.
  - kind: pypi_package
    name: vllm
    version_constraint: ">=0.6"
    notes: Required only for --mode live; the default mock mode is stdlib-only.
  - kind: hosted_model
    name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    revision: main
    notes: Default LLM for --mode live; not used by --mode mock.
license: Apache-2.0
intended_use:
  summary: >
    De-identify Turkish radiology reports by replacing names, dates, hospitals,
    and accession numbers with [entity_N] tokens (MR-RATE reports stage 01).
  scope: development
  not_for:
    - clinical deployment
    - regulatory de-identification
    - autonomous diagnosis
    - patient-facing use
inputs:
  - name: reports_csv
    type: file_path
    formats: [csv]
    max_size_bytes: 1073741824
    description: CSV with UID and report columns of Turkish radiology reports.
outputs:
  - name: anonymization_summary
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/run_anonymization.py
  args:
    - "${python}"
    - "${script}"
    - "${fixture}"
    - "--out"
    - "${out}"
  env_optional: [MR_RATE_REPORTS_ROOT, CUDA_VISIBLE_DEVICES]
  dependencies: {}
  side_effects:
    pip_packages: []
    local_writes:
      - {path: "<out>/anonymized.csv", approx_mb_max: 200, optional: false}
      - {path: "<out>/upstream_out", approx_mb_max: 500, optional: true}
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    gpu_fallback: mock
    env_optional: [MR_RATE_REPORTS_ROOT, CUDA_VISIBLE_DEVICES]
paired_verifiers:
  - id: medagent.verifiers.report_anonymization_quality_v1
    status: implemented
    consumes: evidence_pack_dir
    purpose: >
      Second-pass audit of PHI leakage rate, anonymization-token format, and
      token/mapping consistency over the anonymization evidence pack.
limitations:
  - The default mock mode is a deterministic rule-based redactor over a small
    synthetic vocabulary; it is for CI and verification, not clinical de-identification.
  - Live mode requires a CUDA GPU, vLLM, and the configured vLLM model; it wraps the upstream
    SLURM script in single-rank mode (use run_dual_gpu.sh for data-parallel runs).
  - PHI-leak is a verbatim mapping check; it does not catch PHI the model never
    mapped, nor non-standard identifiers, nor burnt-in pixel text.
phi_scope_disclaimer: >
  This skill replaces detected names, dates, hospitals, and accession numbers
  with tokens. It is NOT a regulatory de-identifier and does not guarantee
  removal of all PHI. Review output before sharing data.
validation:
  expected_runtime_seconds:
    max: 120.0
    inference_path: runtime.elapsed_seconds
  sanity_checks:
    - {path: skill, eq: report-anonymization}
    - {path: n_reports, gt: 0}
    - {path: phi_leak.method, ne: not_evaluated}
    - {path: phi_leak.leak_rate, lte: 0.0}
    - {path: token_format.n_malformed_tokens, eq: 0}
    - {path: token_consistency.n_inconsistent, eq: 0}
    - {path: token_consistency.mapping_extraction_rate, gte: 0.8}
  expected_cost:
    wall_seconds: {max: 120}
    gpu_seconds: {max: 0}
    gpu_memory_mb_peak: {max: 0}
  reproducibility:
    mode: repeat
    fixture: fixtures/sample_reports_turkish.csv
    fixture_builder: fixtures/generate_sample.py
    runs: 2
    ignore_paths:
      - "runtime\\.elapsed_seconds"
      - "artifacts\\..*"
