id: medagent.report_pathology_classification
version: 0.1.0
upstream_refs:
  - kind: source_tree
    name: mr_rate_preprocessing.reports_preprocessing.06_pathology_classification
    revision: monorepo-local
    notes: >
      Upstream multi-step vLLM classifier (classify_pathologies_parallel.py +
      merge_labels.py) wrapped in live mode; path resolved via --mr-rate-root or
      $MR_RATE_REPORTS_ROOT. The pathology vocabulary derives from
      06_pathology_classification/data/pathologies.json.
  - kind: pypi_package
    name: vllm
    version_constraint: ">=0.6"
    notes: Required only for --mode live; the default mock mode is stdlib-only.
  - kind: hosted_model
    name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    revision: main
    notes: Default LLM for --mode live; not used by --mode mock.
license: Apache-2.0
intended_use:
  summary: >
    Classify brain/spine MRI report findings against a fixed pathology list,
    emitting one 0/1 label per pathology per report (MR-RATE reports stage 06).
  scope: development
  not_for:
    - clinical deployment
    - autonomous diagnosis
    - patient-facing use
    - regulatory decision-making
inputs:
  - name: reports_csv
    type: file_path
    formats: [csv]
    max_size_bytes: 1073741824
    description: CSV with study_uid and findings columns of brain/spine MRI reports.
outputs:
  - name: pathology_classification_summary
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/run_report_pathology_classification.py
  args:
    - "${python}"
    - "${script}"
    - "${fixture}"
    - "--out"
    - "${out}"
  env_optional: [MR_RATE_REPORTS_ROOT, CUDA_VISIBLE_DEVICES]
  dependencies: {}
  side_effects:
    pip_packages: []
    local_writes:
      - {path: "<out>/labels.csv", approx_mb_max: 200, optional: false}
      - {path: "<out>/upstream_reports", approx_mb_max: 500, optional: true}
      - {path: "<out>/upstream_out", approx_mb_max: 500, optional: true}
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    gpu_fallback: mock
    env_optional: [MR_RATE_REPORTS_ROOT, CUDA_VISIBLE_DEVICES]
paired_verifiers:
  - id: medagent.verifiers.report_pathology_quality_v1
    status: implemented
    consumes: evidence_pack_dir
    purpose: >
      Second-pass audit of label coverage, JSON-parse success, and invalid-label
      count over the pathology-classification evidence pack.
limitations:
  - The default mock mode is a deterministic keyword-presence classifier over a
    small synthetic vocabulary; it is for CI and verification, not clinical
    classification, and does not parse negation or clinical context.
  - Live mode requires a CUDA GPU, vLLM, and the configured vLLM model; it wraps the
    upstream single-rank classifier (use the upstream SLURM launcher for
    data-parallel runs across multiple GPUs).
  - The committed pathology vocabulary is a 10-label subset of the full upstream
    list; the full upstream pathologies.json carries the complete label set.
phi_scope_disclaimer: >
  This skill produces structured pathology labels from report findings text. It
  does NOT de-identify the input; run the report-anonymization skill first if the
  findings text may contain PHI. Labels are research-grade signals, not a
  clinical diagnosis.
validation:
  expected_runtime_seconds:
    max: 120.0
    inference_path: runtime.elapsed_seconds
  sanity_checks:
    - {path: skill, eq: report-pathology-classification}
    - {path: n_reports, gt: 0}
    - {path: validation.json_parse_success_rate, gte: 1.0}
    - {path: validation.n_invalid_labels, eq: 0}
    - {path: labels.label_coverage_rate, gte: 1.0}
  expected_cost:
    wall_seconds: {max: 120}
    gpu_seconds: {max: 0}
    gpu_memory_mb_peak: {max: 0}
  reproducibility:
    mode: repeat
    fixture: fixtures/sample_reports_mr_findings.csv
    fixture_builder: fixtures/generate_sample.py
    runs: 2
    ignore_paths:
      - "runtime\\.elapsed_seconds"
      - "artifacts\\..*"
