id: medagent.medical_anonymization
version: 0.2.0
upstream_refs:
  - kind: pypi_package
    name: nemo-anonymizer
    version: "0.2.1"
    version_constraint: ">=0.2.1,<0.3"
    notes: >
      NeMo Anonymizer text strategies: Redact, Substitute, Annotate, Hash, Rewrite.
  - kind: github_repo
    name: NVIDIA-NeMo/Anonymizer
    repo_url: https://github.com/NVIDIA-NeMo/Anonymizer
    revision: main
license: Apache-2.0
intended_use:
  summary: >
    General-purpose medical data anonymization: NeMo Anonymizer for unstructured
    text plus deterministic policies for CSV identifiers and DICOM metadata headers.
  scope: development
  not_for:
    - clinical deployment
    - regulatory de-identification
    - autonomous diagnosis
    - patient-facing use
inputs:
  - name: input_path
    type: file_path
    formats: [csv, txt]
    max_size_bytes: 1073741824
    description: >
      Text file, mixed CSV, or flat DICOM metadata CSV. Auto-detected unless
      --input-kind is set.
outputs:
  - name: anonymization_summary
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.11"
  entrypoint: scripts/anonymize_medical_data.py
  args:
    - "${python}"
    - "${script}"
    - "${fixture}"
    - "--output-dir"
    - "${out}"
    - "--local-only"
  env_required: []
  env_optional: [NVIDIA_API_KEY, NEMO_TELEMETRY_ENABLED]
  dependencies:
    nemo-anonymizer: ">=0.2.1,<0.3"
    pandas: ">=2.0"
    pyarrow: ">=14.0"
    pyyaml: ">=6.0"
    tiktoken: ">=0.5"
  side_effects:
    pip_packages:
      - nemo-anonymizer>=0.2.1,<0.3
      - pandas>=2.0
      - pyarrow>=14.0
      - pyyaml>=6.0
      - tiktoken>=0.5
    local_writes:
      - {path: "<output-dir>/run_report.json", approx_mb_max: 20, optional: false}
      - {path: "<output-dir>/deidentified_metadata.jsonl", approx_mb_max: 500, optional: true}
      - {path: "<output-dir>/anonymized_data.csv", approx_mb_max: 200, optional: true}
    network_endpoints:
      - https://integrate.api.nvidia.com
    requires_docker: false
    requires_gpu: none
phi_scope_disclaimer: >
  Applies NeMo Anonymizer for free-text PHI and deterministic policies for
  structured identifiers. NOT a regulatory de-identifier. Review before sharing.
validation:
  expected_runtime_seconds:
    max: 60.0
  sanity_checks:
    - {path: skill, eq: medical-anonymization}
    - {path: n_records, gt: 0}
  reproducibility:
    mode: local
    fixture: fixtures/sample_dicom_metadata.csv
    runs: 1
    reason: >
      DICOM metadata lane is fully local and deterministic; use --local-only fixture
      for eval without NVIDIA_API_KEY.
