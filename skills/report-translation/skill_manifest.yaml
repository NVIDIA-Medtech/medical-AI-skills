id: medagent.report_translation
version: 0.1.0
upstream_refs:
  - kind: source_tree
    name: mr_rate_preprocessing.reports_preprocessing.02_translation
    revision: monorepo-local
    notes: >
      Upstream vLLM translator (translate_reports_parallel.py) plus the stage-03
      QC scripts (detect_turkish_parallel.py, quality_check_parallel.py) wrapped
      in live mode; paths resolved via --mr-rate-root or $MR_RATE_REPORTS_ROOT.
  - kind: pypi_package
    name: vllm
    version_constraint: ">=0.6"
    notes: Required only for --mode live; the default mock mode is stdlib-only.
  - kind: hosted_model
    name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    revision: main
    notes: Default LLM for --mode live; not used by --mode mock.
license: Apache-2.0
intended_use:
  summary: >
    Translate anonymized Turkish radiology reports to English and QC the result
    (MR-RATE reports stage 02 translation + stage 03 translation QC), preserving
    [token_N] anonymization placeholders.
  scope: development
  not_for:
    - clinical deployment
    - clinical translation of record
    - autonomous diagnosis
    - patient-facing use
inputs:
  - name: reports_csv
    type: file_path
    formats: [csv]
    max_size_bytes: 1073741824
    description: >
      CSV with UID and Anonymized_Rapor columns of anonymized Turkish radiology
      reports (the output of MR-RATE stage 01) containing [token_N] placeholders.
outputs:
  - name: translation_summary
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/run_report_translation.py
  args:
    - "${python}"
    - "${script}"
    - "${fixture}"
    - "--out"
    - "${out}"
  env_optional: [MR_RATE_REPORTS_ROOT, CUDA_VISIBLE_DEVICES]
  dependencies: {}
  side_effects:
    pip_packages: []
    local_writes:
      - {path: "<out>/translated.csv", approx_mb_max: 200, optional: false}
      - {path: "<out>/upstream_translated", approx_mb_max: 500, optional: true}
      - {path: "<out>/upstream_detect", approx_mb_max: 200, optional: true}
      - {path: "<out>/upstream_qc", approx_mb_max: 200, optional: true}
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    gpu_fallback: mock
    env_optional: [MR_RATE_REPORTS_ROOT, CUDA_VISIBLE_DEVICES]
paired_verifiers:
  - id: medagent.verifiers.report_translation_quality_v1
    status: implemented
    consumes: evidence_pack_dir
    purpose: >
      Second-pass audit of the LLM-judged translation QC pass rate, the residual
      non-English (Turkish-leftover) rate, and anonymization-token preservation
      through translation over the report-translation evidence pack.
limitations:
  - The default mock mode is a deterministic phrase-dictionary translator over a
    small synthetic Turkish vocabulary with rule-based QC and language detection;
    it is for CI and verification, not clinical translation.
  - Live mode requires a CUDA GPU, vLLM, and the configured vLLM model; it wraps the upstream
    SLURM scripts in single-rank mode (translate -> detect Turkish -> LLM QC).
  - Token preservation is a verbatim string check on [token_N] placeholders; it
    does not assess clinical translation accuracy beyond the LLM QC verdict.
phi_scope_disclaimer: >
  This skill operates on already-anonymized reports and translates the prose; it
  does not add or remove PHI. It is NOT a regulatory de-identifier and does not
  guarantee removal of all PHI. Review output before sharing data.
validation:
  expected_runtime_seconds:
    max: 120.0
    inference_path: runtime.elapsed_seconds
  sanity_checks:
    - {path: skill, eq: report-translation}
    - {path: n_reports, gt: 0}
    - {path: qc.pass_rate, gte: 0.9}
    - {path: language.non_english_rate, lte: 0.0}
    - {path: token_preservation.preservation_rate, gte: 1.0}
    - {path: token_preservation.n_reports_token_dropped, eq: 0}
  expected_cost:
    wall_seconds: {max: 120}
    gpu_seconds: {max: 0}
    gpu_memory_mb_peak: {max: 0}
  reproducibility:
    mode: repeat
    fixture: fixtures/sample_reports_turkish_anonymized.csv
    fixture_builder: fixtures/generate_sample.py
    runs: 2
    ignore_paths:
      - "runtime\\.elapsed_seconds"
      - "artifacts\\..*"
