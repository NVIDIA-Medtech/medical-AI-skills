id: medagent.mri_brain_seg_deface
version: "0.1.0"
upstream_refs:
  - kind: github_repo
    name: Forithmus/MR-RATE
    repo_url: https://github.com/Forithmus/MR-RATE
    revision: main
    notes: wraps mr_rate_preprocessing MRI brainseg
license: Apache-2.0
intended_use:
  summary: >
    predicts a brain mask with HD-BET and removes facial features with Quickshear, writing defaced volumes plus brain and defacing masks (MR-RATE MRI step 5).
  scope: development
  not_for:
    - clinical deployment
    - regulatory de-identification
    - autonomous diagnosis
    - patient-facing use
inputs:
  - name: fixtures_dir
    type: directory
  - name: mr_rate_root
    type: directory
outputs:
  - name: result_json
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/run_brain_seg_deface.py
  side_effects:
    requires_gpu: cuda
    pip_packages:
      - torch
      - brainles_hd_bet
      - SimpleITK
      - nibabel
      - numpy
      - scipy
limitations:
  - Upstream accession_to_uid anonymization is currently an identity pass-through, so study-ID de-identification is a no-op unless inputs are pre-anonymized.
  - Ships with small synthetic PHI-free fixtures; not clinically representative.
phi_scope_disclaimer: >
  Not a regulatory de-identifier; review output before sharing. Not for clinical use.
validation:
  expected_runtime_seconds:
    max: 900
    inference_path: telemetry.wall_seconds
  sanity_checks:
    - {path: skill, eq: mri-brain-seg-deface}
    - {path: status, eq: ok}
    - {path: preflight.aligned, eq: true}
    - {path: telemetry.wall_seconds, gte: 0}
  reproducibility:
    mode: preflight
    fixture: fixtures
    reason: "GPU-only step; evidence gated on CUDA availability"
