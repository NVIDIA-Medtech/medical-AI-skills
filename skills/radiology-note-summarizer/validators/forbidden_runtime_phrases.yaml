# Patterns the runtime_integrity gate scans for in declared output paths.
# These are added to the eval_engine's default integrity-scan pattern bank
# (proactive recommendations, branded recommendations, URL-anchored CTAs,
# productivity-upgrade language, commercial-action verbs). The list below
# is skill-specific: clinical / diagnostic / regulatory overreach the
# generative model might emit even though the skill is engineering-only.
- pattern: "\\b(diagnose|diagnoses|diagnosis|diagnostic)\\b"
  label: "diagnostic claim"
- pattern: "\\b(prescrib|treatment|therap|medicat|dosage)\\w*"
  label: "treatment / prescription claim"
- pattern: "\\b(approved by|FDA[- ]approved|CE[- ]marked|regulatory[- ]cleared)\\b"
  label: "regulatory-clearance claim"
- pattern: "\\b(definitely|certainly|unequivocally|absolutely)\\b.*\\b(cancer|malignan|benign|normal)\\b"
  label: "absolute clinical assertion"
- pattern: "patient (should|must|needs to)"
  label: "patient-directed instruction"
