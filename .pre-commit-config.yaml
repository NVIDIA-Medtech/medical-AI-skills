# Pre-commit hooks for Medical AI Skills.
#
#   one-time setup : pre-commit install
#   check the tree : pre-commit run --all-files
#   refresh pins   : pre-commit autoupdate
#
# Tool config: pyproject.toml (black/isort/ruff), .github/.markdownlint.yaml (markdownlint).
# C++/CMake/metadata hooks from HoloHub are omitted (not applicable here).

# Bot-generated signing artifacts are committed by svc-nvskills-signing; never touch them.
exclude: '(\.oms\.sig$|(^|/)(skill-card|BENCHMARK)\.md$|(^|/)skill_completeness_v1/fixtures/)'

repos:
  # General hygiene (skip generated evidence/fixtures and vendored docs)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        exclude: '^examples/|(^|/)fixtures/|^tools/[^/]+/upstream_docs/'
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^examples/|(^|/)fixtures/|^tools/[^/]+/upstream_docs/'
      - id: mixed-line-ending
        exclude: '^examples/|(^|/)fixtures/'

  # Python: ruff (lint + safe autofixes)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]

  # Python: isort (config in pyproject.toml)
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--settings-path, .]

  # Python: black (config in pyproject.toml)
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  # Markdown: markdownlint (config + ignores under .github/)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .github/.markdownlint.yaml, --ignore-path, .github/.markdownlintignore]

  # Copyright header check (NVIDIA SPDX) — mirrors .github/workflows/check_compliance.yml
  - repo: local
    hooks:
      - id: check-copyright
        name: check-copyright
        entry: python3 .github/workflows/scripts/check_copyright.py
        args:
          - .
          - --git-modified-only
          - --exclude-config
          - .github/workflows/scripts/copyright_excludes.txt
          - --update-current-year
        language: system
        pass_filenames: false
