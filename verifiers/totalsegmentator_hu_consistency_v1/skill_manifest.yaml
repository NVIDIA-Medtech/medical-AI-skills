id: medagent.verifiers.totalsegmentator_hu_consistency_v1
version: 0.1.0
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for totalsegmentator evidence packs. For each
    label present in the predicted multilabel mask, samples voxels from
    the recorded input CT volume and checks the median HU against a
    per-organ population-typical range. Catches mask-in-wrong-place
    failures that the anatomy_plausibility tier can't see.
  scope: development
  not_for:
    - clinical deployment
    - clinical interpretation
    - autonomous diagnosis
    - regulatory submission

inputs:
  - name: totalsegmentator_evidence_pack
    type: directory_path
    description: >
      Directory containing an evidence pack produced by
      skills/totalsegmentator. The verifier reads output.json, the
      referenced input CT NIfTI, and the predicted multilabel NIfTI.

outputs:
  - name: totalsegmentator_hu_consistency_report
    type: json
    schema: validators/output_schema.json

runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies:
    nibabel: ">=4.0"
    numpy: ">=1.23"
  side_effects:
    pip_packages:
      - nibabel>=4.0
      - numpy>=1.23
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    env_required: []
    env_optional: []

limitations:
  - >
    Per-class HU ranges in validators/hu_bounds_total.json are
    population-typical non-contrast CT ranges. Contrast-enhanced studies
    will push vessels outside the non-contrast band; the bounds use a
    deliberately wide band for vessels (0-400 HU) to accommodate both.
  - >
    Bounds for non-`total` tasks are not yet defined. The verifier still
    runs but skips any class without a recorded HU bound.
  - >
    Median is used (not mean) to resist partial-volume voxels at organ
    boundaries. A mask that is mostly correct but bleeds into adjacent
    fat or bone can still pass.

validation:
  expected_runtime_seconds:
    max: 60.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.totalsegmentator_hu_consistency_v1}
    - {path: target.skill_id, eq: totalsegmentator}
    - {path: input_inventory.input_volume_readable, eq: true}
    - {path: input_inventory.label_map_readable, eq: true}
    - {path: hu_consistency.verdict, eq: pass}
    - {path: overall, eq: pass}
  reproducibility:
    mode: preflight
    fixture: fixtures/README.md
    runs: 2
    reason: >
      The deterministic pass pack is synthesized in tests to avoid committing
      extra NIfTI artifacts. The repository audit repeats the declared
      directory/env boundary check; tests exercise full verifier execution.
