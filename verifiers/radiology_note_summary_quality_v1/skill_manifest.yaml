id: medagent.verifiers.radiology_note_summary_quality_v1
version: 0.1.0
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for radiology_note_summarizer evidence packs.
    Audits source-pack success, fixture fact echo, model/prompt identity,
    and absence of forbidden clinical, treatment, or regulatory overreach
    phrases in generated output fields.
  scope: development
  not_for:
    - clinical interpretation
    - regulatory submission
    - autonomous diagnosis
    - patient-facing report generation

inputs:
  - name: radiology_note_summarizer_evidence_pack
    type: directory_path
    description: >
      Directory containing an evidence pack produced by
      skills/radiology-note-summarizer. The verifier reads output.json,
      validation_summary.json, manifest.json, the recorded fixture, and the
      committed prompt/runtime-integrity assets.

outputs:
  - name: radiology_note_summary_quality_report
    type: json
    schema: validators/output_schema.json

runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies:
    pyyaml: ">=6.0"
  side_effects:
    pip_packages:
      - pyyaml>=6.0
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    env_required: []
    env_optional: []

limitations:
  - >
    This verifier checks engineering invariants over the evidence pack; it
    does not validate clinical correctness or summarize radiology quality.
  - >
    Forbidden-phrase detection is regex-based and intentionally conservative.
    Passing it means no known overreach phrase was found, not that prose is
    clinically safe.
  - >
    Prompt-hash checks bind the pack to the committed prompt files available
    in this checkout. Historical packs from older prompt revisions may fail
    until regenerated or reviewed as legacy evidence.

validation:
  expected_runtime_seconds:
    max: 30.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.radiology_note_summary_quality_v1}
    - {path: target.skill_id, eq: radiology_note_summarizer}
    - {path: target.source_overall_status, eq: passed}
    - {path: summary_quality.acceptable, eq: true}
    - {path: summary_quality.forbidden_finding_count, eq: 0}
    - {path: summary_quality.study_instance_uid, matches: "^(?:[0-9.]+|SYNTH-STUDY-[0-9]{3})$"}
    - {path: summary_quality.model, eq: nvidia/openai/gpt-oss-20b}
    - {path: overall, eq: pass}
  reproducibility:
    mode: repeat
    fixture: fixtures/pass_pack
    runs: 2
