id: medagent.verifiers.endoscopy_tool_detection_quality_v1
version: 0.1.0
upstream_refs:
  - kind: workbench_verifier
    name: endoscopy_tool_detection_quality_v1
    version: 0.1.0
    notes: Deterministic verifier script and schema version tracked in this repo.
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for HoloHub endoscopy tool-tracking evidence
    packs. It consumes a completed evidence-pack directory, verifies
    that the pack came from the endoscopy wrapper and passed its source
    gates, then checks for non-empty recording artifacts and decoded
    per-frame detection artifacts. When decoded detections are present,
    it computes basic surgical-domain floor metrics: tools detected,
    frame coverage, mean detections per frame, bbox sanity, and observed
    tool classes.
  scope: development
  not_for:
    - clinical deployment
    - clinical interpretation
    - autonomous diagnosis
    - regulatory submission
    - intra-operative guidance

inputs:
  - name: endoscopy_evidence_pack
    type: directory_path
    description: >
      Directory containing an evidence pack produced by
      skills/holohub-endoscopy-tool-tracking. The verifier reads
      output.json, validation_summary.json, manifest.json, and any
      recording/detection artifacts referenced by output.json.

outputs:
  - name: detection_quality_report
    type: json
    schema: validators/output_schema.json

runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies: {}
  side_effects:
    pip_packages: []
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    env_required: []
    env_optional: []

limitations:
  - >
    The verifier does not decode raw GXF tensor streams. For the detection
    metrics gate to pass, the evidence pack must contain a decoded
    detection artifact (JSON, JSONL, NDJSON, or CSV) whose filename
    clearly identifies it as detection/tool/bbox/tracking output.
    Current HoloHub wrapper runs that only contain .gxf_entities /
    .gxf_index recordings will fail the decoded-detection-artifact
    floor check until an upstream instrumentation operator or GXF
    decoder produces that artifact.
  - >
    Bbox sanity is a deterministic engineering floor, not a clinical
    assessment. It verifies non-degenerate boxes and in-frame bounds
    when frame dimensions are present.
  - >
    Class-distribution checking is intentionally shallow in v0.1: it
    requires that at least one class label is observed, but does not
    assert a procedure-specific distribution.

validation:
  expected_runtime_seconds:
    max: 10.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.endoscopy_tool_detection_quality_v1}
    - {path: target.skill_id, eq: holohub_endoscopy_tool_tracking}
    - {path: artifact_inventory.recording_file_count, gte: 1}
    - {path: artifact_inventory.detection_artifact_count, gte: 1}
    - {path: domain_floor.verdict, eq: pass}
    - {path: detection_metrics.verdict, eq: pass}
    - {path: detection_metrics.tools_detected_count, gt: 0}
    - {path: detection_metrics.bbox_sanity.invalid, eq: 0}
  reproducibility:
    mode: repeat
    fixture: fixtures/pass_pack
    runs: 2
