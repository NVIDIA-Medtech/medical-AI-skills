id: medagent.verifiers.holohub_imaging_segmentation_quality_v1
version: 0.1.0
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for HoloHub imaging_ai_segmentator evidence packs.
    Confirms the wrapper ran cleanly and produced non-empty segmentation artifacts
    (DICOM SEG, NIfTI pair, positive seg_pixel_max_value).
  scope: development
  not_for:
    - clinical deployment
    - clinical interpretation
    - autonomous diagnosis
    - regulatory submission

inputs:
  - name: imaging_evidence_pack
    type: directory_path
    description: Evidence pack from skills/holohub-imaging-ai-segmentator.

outputs:
  - name: segmentation_quality_report
    type: json
    schema: validators/output_schema.json

runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies:
    nibabel: ">=4.0"
    numpy: ">=1.23"
  side_effects:
    pip_packages:
      - nibabel>=4.0
      - numpy>=1.23
    requires_docker: false
    requires_gpu: none

limitations:
  - >
    Does not assert organ-specific Dice or anatomy bounds (see
    ct_segmentation_quality_v1 for CT label-map floors). Focuses on HoloHub
    artifact inventory and seg_signals from the wrapper.
  - >
    NIfTI load is optional; packs that only retain output.json inventory pass
    the domain floor without on-disk NIfTI.

validation:
  expected_runtime_seconds:
    max: 30.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.holohub_imaging_segmentation_quality_v1}
    - {path: domain_floor.verdict, eq: pass}
    - {path: overall, eq: pass}
  reproducibility:
    mode: repeat
    fixture: fixtures/pass_pack
    runs: 2
