id: medagent.verifiers.report_translation_quality_v1
version: 0.1.0
upstream_refs:
  - kind: workbench_verifier
    name: report_translation_quality_v1
    version: 0.1.0
    notes: Deterministic verifier script and schema version tracked in this repo.
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for Turkish->English radiology-report translation
    evidence packs. Audits source-pack success, LLM-judged translation QC pass
    rate, residual non-English rate, and anonymization-token preservation.
  scope: development
  not_for:
    - clinical deployment
    - regulatory de-identification
    - autonomous diagnosis
inputs:
  - name: report_translation_evidence_pack
    type: directory_path
    description: >
      Evidence pack directory built from a radiology-report translation + QC run
      (output.json, manifest.json, validation_summary.json).
outputs:
  - name: report_translation_quality_report
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies: {}
  side_effects:
    pip_packages: []
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
limitations:
  - Translation QC pass rate and language detection are LLM-judged upstream and
    can include false positives; this verifier grades the recorded metrics.
  - A passing verdict is an engineering signal, not a clinical accuracy claim.
  - Token preservation is a verbatim string check; it does not assess semantic
    fidelity beyond the recorded QC verdict.
validation:
  expected_runtime_seconds:
    max: 10.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.report_translation_quality_v1}
    - {path: target.skill_id, matches: "translation"}
    - {path: translation_quality.n_fail, eq: 0}
    - {path: translation_quality.acceptable, eq: true}
  reproducibility:
    mode: repeat
    fixture: fixtures/pass_pack
    runs: 2
