id: medagent.verifiers.report_structuring_quality_v1
version: 0.1.0
upstream_refs:
  - kind: workbench_verifier
    name: report_structuring_quality_v1
    version: 0.1.0
    notes: Deterministic verifier script and schema version tracked in this repo.
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for radiology-report structuring evidence packs.
    Audits source-pack success, section-parse success rate, structure-QC pass
    rate, and formatting-rule violations (findings bullets, header leakage).
  scope: development
  not_for:
    - clinical deployment
    - regulatory de-identification
    - autonomous diagnosis
inputs:
  - name: report_structuring_evidence_pack
    type: directory_path
    description: >
      Evidence pack directory built from a report-structuring run
      (output.json, manifest.json, validation_summary.json).
outputs:
  - name: report_structuring_quality_report
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies: {}
  side_effects:
    pip_packages: []
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
limitations:
  - Structure QC is graded from the metric recorded in the pack; it does not
    re-read the raw reports or re-run the LLM judge.
  - A passing verdict is an engineering signal, not a clinical accuracy claim.
  - Empty-impression reports are acceptable; completeness is advisory (warn-only).
validation:
  expected_runtime_seconds:
    max: 10.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.report_structuring_quality_v1}
    - {path: target.skill_id, matches: "structuring"}
    - {path: structuring_quality.n_fail, eq: 0}
    - {path: structuring_quality.acceptable, eq: true}
  reproducibility:
    mode: repeat
    fixture: fixtures/pass_pack
    runs: 2
