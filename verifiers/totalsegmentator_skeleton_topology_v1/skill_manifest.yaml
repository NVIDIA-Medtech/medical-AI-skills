id: medagent.verifiers.totalsegmentator_skeleton_topology_v1
version: 0.1.0
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for totalsegmentator evidence packs. Loads the
    predicted multilabel NIfTI and checks three skeleton invariants
    specific to TotalSegmentator's total-task class IDs: vertebra-chain
    z-monotonicity (C1→sacrum), vertebral body size monotonicity
    (lumbar > thoracic > cervical), and rib bilateral pairing
    (rib_left_N ↔ rib_right_N volumes within tolerance).
  scope: development
  not_for:
    - clinical deployment
    - clinical interpretation
    - autonomous diagnosis
    - regulatory submission

inputs:
  - name: totalsegmentator_evidence_pack
    type: directory_path
    description: >
      Directory containing an evidence pack produced by
      skills/totalsegmentator. The verifier reads output.json and the
      referenced multilabel NIfTI.

outputs:
  - name: totalsegmentator_skeleton_topology_report
    type: json
    schema: validators/output_schema.json

runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies:
    nibabel: ">=4.0"
    numpy: ">=1.23"
  side_effects:
    pip_packages:
      - nibabel>=4.0
      - numpy>=1.23
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
    env_required: []
    env_optional: []

limitations:
  - >
    Vertebra and rib label IDs are hardcoded to TotalSegmentator's `total`
    task. Other tasks (heartchambers_highres, body, ...) don't have a
    full skeleton segmentation and this verifier will return verdict=
    skipped for them.
  - >
    The chain-monotonicity check accepts either ascending or descending
    z-order so it is orientation-agnostic. A 1-voxel local violation in
    the centroid order can fire if vertebrae are very thin slabs; the
    tolerance is configurable in scripts/grade.py.
  - >
    Rib volume tolerance is set to 40 % to accommodate normal individual
    variation. Cases with partial-coverage rib segmentation (e.g.
    truncated chest CT) may falsely fail; this verifier is an
    engineering floor.

validation:
  expected_runtime_seconds:
    max: 30.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.totalsegmentator_skeleton_topology_v1}
    - {path: target.skill_id, eq: totalsegmentator}
    - {path: input_inventory.label_map_readable, eq: true}
    - {path: vertebra_chain.verdict, contains_any_of: ["pass", "skipped"]}
    - {path: vertebra_body_size_monotonic.verdict, contains_any_of: ["pass", "skipped"]}
    - {path: rib_pair_symmetry.verdict, contains_any_of: ["pass", "skipped"]}
    - {path: overall, eq: pass}
  reproducibility:
    mode: preflight
    fixture: fixtures/README.md
    runs: 2
    reason: >
      The deterministic pass pack is synthesized in tests to avoid committing
      extra NIfTI artifacts. The repository audit repeats the declared
      directory/env boundary check; tests exercise full verifier execution.
