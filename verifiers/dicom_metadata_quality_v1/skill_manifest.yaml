id: medagent.verifiers.dicom_metadata_quality_v1
version: 0.1.0
upstream_refs:
  - kind: workbench_verifier
    name: dicom_metadata_quality_v1
    version: 0.1.0
    notes: Deterministic verifier script and schema version tracked in this repo.
license: Apache-2.0
intended_use:
  summary: >
    Deterministic verifier for dicom_metadata_extract evidence packs. Audits
    source-pack success, required header facts, PHI-flag consistency, and scope
    disclosure.
  scope: development
  not_for:
    - clinical deployment
    - regulatory de-identification
    - autonomous diagnosis
inputs:
  - name: dicom_metadata_evidence_pack
    type: directory_path
    description: Evidence pack directory from skills/dicom-metadata-extract.
outputs:
  - name: dicom_metadata_quality_report
    type: json
    schema: validators/output_schema.json
runtime:
  language: python
  python: ">=3.10"
  entrypoint: scripts/grade.py
  env_required: []
  dependencies: {}
  side_effects:
    pip_packages: []
    local_writes: []
    home_writes: []
    network_endpoints: []
    requires_docker: false
    requires_gpu: none
limitations:
  - PHI tag presence is advisory; this is not a de-identification audit.
  - Mirrors the source skill's standard-tag scope and does not inspect private tags.
  - Does not decode pixels or detect burnt-in pixel PHI.
validation:
  expected_runtime_seconds:
    max: 10.0
  sanity_checks:
    - {path: verifier.id, eq: medagent.verifiers.dicom_metadata_quality_v1}
    - {path: target.skill_id, matches: "dicom_metadata_extract"}
    - {path: metadata_quality.n_fail, eq: 0}
    - {path: metadata_quality.acceptable, eq: true}
  reproducibility:
    mode: repeat
    fixture: fixtures/pass_pack
    runs: 2
